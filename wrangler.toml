# Cloudflare: the static export (out/) served as Workers static assets, as gulforbit.sa does.
# No Worker code: the quote form opens WhatsApp or email, so there is no server.
name = "saad-jamal"
compatibility_date = "2026-10-01"

[assets]
directory = "./out"
not_found_handling = "404-page"
# /about.html and /about/ redirect to /about.
html_handling = "auto-trailing-slash"
