# Cloudflare Worker, as on gulforbit.sa: the static export (out/) is served as assets,
# and worker/index.ts runs only for the form endpoint under /api/.
name = "saadjamal"
main = "worker/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# Variables set in the dashboard survive deploys.
keep_vars = true

[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
run_worker_first = ["/api/*"]

# Secret (never commit it):  npx wrangler secret put RESEND_API_KEY
[vars]
RESEND_FROM_EMAIL = "info@saadjamal.sa"
NOTIFICATION_EMAIL = "info@saadjamal.sa"
